  <script>
/* MON DOUDOU — démonstration locale de borne tactile.
   Ne relie ni paiement, ni serrure, ni serveur. N'accepte aucune carte bancaire réelle. */
(() => {
  'use strict';
  const PRODUCTS = window.MON_DOUDOU_PRODUCTS || [];
  const screen = document.querySelector('#screen');
  const overlay = document.querySelector('#overlay');
  const toastEl = document.querySelector('#toast');
  const money = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });
  const state = { view: 'home', category: 'peluches', page: 0, cart: [], keypad: '', method: 'card', orders: [], lastOrder: null, timer: null };
  const STOR_KEY = 'mondoudou-prototype-orders-v1';
  try {
    const all = JSON.parse(localStorage.getItem(STOR_KEY) || '[]');
    state.orders = Array.isArray(all) ? all.filter(o => o && /^\d{8}$/.test(o.code) && Array.isArray(o.slots)).slice(-200) : [];
  } catch (e) { state.orders = []; }
  const itemById = new Map(PRODUCTS.map(p => [p.id, p]));
  const total = () => state.cart.reduce((n, id) => n + (itemById.get(id)?.price || 0), 0);
  const fmt = n => money.format(n);
  const cartSlots = () => [...new Set(state.cart.map(id => itemById.get(id)?.slot).filter(Boolean))].sort((a, b) => a - b);
  const h = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function saveOrders() { try { localStorage.setItem(STOR_KEY, JSON.stringify(state.orders.slice(-200))); } catch (e) {} }
  function randomInteger(max) {
    if (window.crypto?.getRandomValues) {
      const buf = new Uint32Array(1); window.crypto.getRandomValues(buf);
      return buf[0] % max;
    }
    return Math.floor(Math.random() * max);
  }
  function makeCode() {
    let code;
    do { code = String(randomInteger(90000000) + 10000000); }
    while (code === '12345678' || state.orders.some(o => o.code === code));
    return code;
  }
  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toastEl._timer);
    toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }
  function closeOverlay() { overlay.hidden = true; overlay.innerHTML = ''; }
  function showOverlay(html) { overlay.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`; overlay.hidden = false; }
  function resetIdle() {
    clearTimeout(state.timer);
    state.timer = setTimeout(() => {
      closeOverlay(); state.cart = []; state.keypad = ''; state.lastOrder = null; setView('home');
    }, 180000);
  }
  for (const type of ['pointerdown', 'keydown']) { window.addEventListener(type, resetIdle, { passive: true }); }
  function setView(view) {
    state.view = view;
    closeOverlay();
    document.querySelector('#cart-top').hidden = !['catalog','payment'].includes(view);
    document.querySelectorAll('.cart-count').forEach(el => el.textContent = state.cart.length);
    const messages = { home: 'Bienvenue dans notre univers tout doux !', category:'À vous de choisir 💙',catalog:'Découvrez les 80 cases de notre collection',pickup:'Retrait avec votre code',payment:'Un dernier petit pas !',success:'Merci de votre visite ♡' };
    document.querySelector('#header-context').textContent = messages[view] || '';
    screen.innerHTML = ({ home:renderHome,category:renderCategory,catalog:renderCatalog,pickup:renderPickup,payment:renderPayment,success:renderSuccess }[view] || renderHome)();
    if (view === 'pickup') setTimeout(() => document.querySelector('#pickup-code')?.focus({preventScroll:true}), 50);
    if (view === 'payment') {
      const input = document.querySelector('#test-card');
      if (input) input.addEventListener('input', ev => {
        const v = ev.target.value.replace(/\D/g,'').slice(0,16);
        ev.target.value = v.replace(/(\d{4})(?=\d)/g,'$1 ');
      });
    }
    resetIdle();
  }
  function renderHome() {
    return `<section class="home-screen">
      <div class="screen-heading home-heading"><span class="eyebrow">✦ Bienvenue dans votre espace câlin</span><h1>Un petit bonheur<br>vous attend ici ! <span aria-hidden="true">🧸</span></h1><p>Que souhaitez-vous faire aujourd'hui ?</p></div>
      <div class="home-options">
        <button class="option-card" data-action="pickup"><span class="floating-stars">✦</span><span class="option-art">🔓</span><strong>Retirer un article</strong><p>Vous avez un code à 8 chiffres ?<br>Récupérez votre surprise dans son casier.</p><span class="option-link"><span class="circle-arrow">→</span> Je récupère mon article</span></button>
        <button class="option-card primary" data-action="choose"><span class="floating-stars">✧</span><span class="option-art">🧸</span><strong>Choisir un article</strong><p>Découvrez nos peluches et accessoires<br>tout doux et composez votre panier.</p><span class="option-link"><span class="circle-arrow">→</span> Je découvre la collection</span></button>
      </div></section>`;
  }
  function renderCategory() {
    return `<section class="select-screen"><div class="screen-heading select-heading"><span class="eyebrow">✦ Étape 1 sur 3</span><h1>Qu'est-ce qui vous ferait plaisir ?</h1><p>Choisissez une famille d'articles pour découvrir ses 80 cases.</p></div>

        <button class="category-card" data-action="category" data-category="accessoires"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNTAgMjIwIiByb2xlPSJpbWciPjxkZWZzPjxsaW5lYXJHcmFkaWVudCBpZD0iYmciIHgxPSIwIiB5MT0iMCIgeDI9IjEiIHkyPSIxIj48c3RvcCBzdG9wLWNvbG9yPSIjZmZmIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjZDFkZWY3Ii8+PC9saW5lYXJHcmFkaWVudD48ZmlsdGVyIGlkPSJzIj48ZmVEcm9wU2hhZG93IGR4PSIwIiBkeT0iNyIgc3RkRGV2aWF0aW9uPSI3IiBmbG9vZC1jb2xvcj0iIzZhOTJiMCIgZmxvb2Qtb3BhY2l0eT0iLjE2Ii8+PC9maWx0ZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIyNTAiIGhlaWdodD0iMjIwIiByeD0iMjkiIGZpbGw9InVybCgjYmcpIi8+PGNpcmNsZSBjeD0iMjgiIGN5PSIyOSIgcj0iOCIgZmlsbD0iI2ZmZiIgb3BhY2l0eT0iLjY1Ii8+PGNpcmNsZSBjeD0iMjIwIiBjeT0iNTQiIHI9IjEzIiBmaWxsPSIjZmZmIiBvcGFjaXR5PSIuNiIvPjxjaXJjbGUgY3g9IjIwNiIgY3k9IjE5MCIgcj0iNyIgZmlsbD0iI2ZmZiIgb3BhY2l0eT0iLjY2Ii8+PGVsbGlwc2UgY3g9IjEyNSIgY3k9IjE5MiIgcng9IjYzIiByeT0iMTAiIGZpbGw9IiM4NzlmYmIiIG9wYWNpdHk9Ii4xNiIvPjxnIGZpbHRlcj0idXJsKCNzKSI+PHBhdGggZD0iTTEyMSAxMTJRODQgNTcgNTEgODNRMjYgMTE4IDYyIDE0MFE5NCAxNTkgMTIzIDEyNlExNTUgMTU5IDE4OSAxNDBRMjI3IDExOCAxOTUgODNRMTU1IDU3IDEyOSAxMTJaIiBmaWxsPSIjZDFkZWY3Ii8+PHJlY3QgeD0iMTEyIiB5PSIxMDAiIHdpZHRoPSIyNiIgaGVpZ2h0PSIzNyIgcng9IjgiIGZpbGw9IiNhOWEwZGQiLz48L2c+PHJlY3QgeD0iMTQiIHk9IjE0IiB3aWR0aD0iNDMiIGhlaWdodD0iMjciIHJ4PSIxMyIgZmlsbD0iI2ZmZiIgb3BhY2l0eT0iLjkxIi8+PHRleHQgeD0iMzUiIHk9IjMyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LWZhbWlseT0iQXJpYWwsc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxMyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzRhNzg5YiI+MDM8L3RleHQ+PC9zdmc+" alt="Illustration d'un nœud papillon"/><strong>🎀 Accessoires</strong><span>80 petits trésors à assortir</span></button>
      </div><button class="ghost-button below-action" data-action="home">← Retour à l'accueil</button></section>`;
  }
  function renderCatalog() {
    const list=PRODUCTS.filter(p=>p.category===state.category).slice(state.page*40,(state.page+1)*40);
    return `<section class="catalog-screen">
      <div class="catalog-controls"><div class="catalog-title"><h1>${state.category==='peluches'?'🧸 Les peluches':'🎀 Les accessoires'}</h1><p>Sélectionnez une ou plusieurs cases pour remplir votre panier.</p></div>
        <div class="category-switch"><button data-action="switch" data-category="peluches" class="${state.category==='peluches'?'active':''}">🧸 Peluches</button><button data-action="switch" data-category="accessoires" class="${state.category==='accessoires'?'active':''}">🎀 Accessoires</button></div>
        <div class="grid-meta"><span><i></i> Cases ${state.page?41:1}–${state.page?80:40}</span></div></div>
      <div class="products-grid">${list.map(p=>`<button type="button" class="product-cell ${state.cart.includes(p.id)?'in-cart':''}" data-action="detail" data-id="${p.id}" aria-label="Case ${p.slot}, ${h(p.name)}, ${fmt(p.price)}, voir l'article">
         <span class="case-label">Case ${p.slot}</span><span class="checked">✓</span><img loading="lazy" src="${p.img}" alt=""/><strong>${h(p.name)}</strong><small>${fmt(p.price)}</small></button>`).join('')}</div>
      <div class="catalog-footer"><button class="ghost-button" data-action="choose">← Catégories</button>
        <div class="paging"><button class="secondary-button" data-action="prev" ${state.page===0?'disabled':''}>← Précédentes</button><span class="page-indicator">Page ${state.page+1} / 2</span><button class="secondary-button" data-action="next" ${state.page===1?'disabled':''}>Suivantes →</button></div>
        <div class="basket-cta"><div class="basket-summary"><span>${state.cart.length} article${state.cart.length>1?'s':''} sélectionné${state.cart.length>1?'s':''}</span><strong>${fmt(total())}</strong></div><button class="primary-button" data-action="cart">🛍️ Voir mon panier</button></div></div>
    </section>`;
  }
  function renderPickup() {
    return `<section class="pickup-screen"><div class="pick-box"><div class="screen-heading"><span class="eyebrow">🔓 Retrait d'article</span><h1>Votre code de retrait</h1><p>Saisissez les 8 chiffres reçus après votre commande.</p></div>
      <input id="pickup-code" class="code-input" type="text" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="Code de retrait à huit chiffres" placeholder="••••••••" value="${h(state.keypad)}"/>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9,'effacer',0,'retour'].map(x=>`<button type="button" class="${typeof x==='string'?'special':''}" data-action="key" data-key="${x}">${x==='effacer'?'⌫':x==='retour'?'C':x}</button>`).join('')}</div>
      <div class="input-error" id="pickup-error" aria-live="polite"></div>
      <div class="form-actions"><button class="ghost-button" data-action="home">← Accueil</button><button class="primary-button wide" data-action="validate-code">Valider mon code →</button></div>
      <span class="tiny-note">Pour tester : code 12345678 (ou un code reçu après un achat simulé).</span>
    </div></section>`;
  }
  function renderPayment() {
    const lines = state.cart.map(id=>itemById.get(id)).filter(Boolean);
    return `<section class="payment-screen"><div class="payment-shell"><div class="pay-box"><span class="eyebrow">✦ Étape 3 sur 3</span><h1 class="payment-title">Finaliser mon panier</h1><p class="payment-copy">Sélectionnez un moyen de paiement pour la simulation.</p>
      <div class="method-grid"><button class="method ${state.method==='card'?'active':''}" data-action="method" data-method="card"><span>💳</span>Carte test</button><button class="method ${state.method==='apple'?'active':''}" data-action="method" data-method="apple"><span></span>Apple Pay</button><button class="method ${state.method==='paypal'?'active':''}" data-action="method" data-method="paypal"><span>🅿</span>PayPal</button></div>
      ${state.method==='card'?`<div class="test-card-box"><label for="test-card">Numéro fictif de test uniquement</label><input id="test-card" type="text" inputmode="numeric" maxlength="19" placeholder="4242 4242 4242 4242" autocomplete="off"/><p>Utilisez 4242 4242 4242 4242. <strong>Ne saisissez jamais une véritable carte bancaire.</strong> Aucune donnée n'est envoyée ni sauvegardée.</p></div>`:`<div class="test-card-box">${state.method==='apple'?'🍎 Apple Pay':'🅿 PayPal'} — Simulation visuelle, sans connexion bancaire et sans prélèvement.</div>`}
      <div id="payment-error" class="payment-error" role="status"></div><div class="pay-bottom"><button class="ghost-button" data-action="catalog">← Retour</button><button class="primary-button" data-action="pay">${state.method==='card'?'Simuler le paiement':'Simuler avec '+(state.method==='apple'?'Apple Pay':'PayPal')} ✓</button></div>
      </div><aside class="recap-box"><h3>🛍️ Votre sélection</h3>${lines.map(p=>`<div class="recap-line"><span>${h(p.name)} · case ${p.slot}</span><b>${fmt(p.price)}</b></div>`).join('')}
      <div class="recap-total"><span>Total</span><strong>${fmt(total())}</strong></div><div class="demo-disclaimer"><strong>Mode démonstration</strong><br>Cette borne n'effectue aucun encaissement et n'ouvre aucun casier physique. Pour l'installation réelle, un terminal de paiement certifié et un contrôleur de casiers doivent être intégrés.</div></aside></div></section>`;
  }
  function renderSuccess() {
    const ord=state.lastOrder||{code:'',slots:[]};
    return `<section class="success-screen"><div class="success-box"><div class="success-icon">✓</div><h1>${ord.kind==='pickup'?'Code validé !':'Paiement de test accepté !'}</h1>
      <p class="subtitle">${ord.kind==='pickup'?'Voici le casier correspondant à votre code.':'Votre commande est prête dans les cases sélectionnées.'}</p>
      <div class="open-cases">${ord.slots.map(n=>`<div class="open-case"><small>Case ouverte*</small>${String(n).padStart(2,'0')}</div>`).join('')}</div>
      <div class="success-reminder">✓ Merci de refermer ${ord.slots.length>1?'les cases':'la case'} après avoir récupéré ${ord.slots.length>1?'vos articles':'votre article'}.</div>
      ${ord.kind==='payment'?`<div class="order-code">Votre code de retrait à 8 chiffres (fonctionne dans cette démonstration) <b>${ord.code}</b>Conservez-le si vous souhaitez tester « Retirer un article ».</div>`:''}
      <div class="tiny-note">*Ouverture simulée : aucun casier physique n'a été commandé.</div>
      <button class="primary-button wide" data-action="finish">Terminer et revenir à l'accueil →</button>
    </div></section>`;
  }
  function showDetail(id) {
    const p=itemById.get(id); if(!p) return;
    const chosen=state.cart.includes(id);
    showOverlay(`<button class="modal-close" data-action="close" aria-label="Fermer">×</button><div class="detail-wrap"><img src="${p.img}" alt="Illustration de ${h(p.name)}"/><div><span class="case-mini">📦 Case n° ${p.slot}</span><h2>${h(p.name)}</h2><p>${p.category==='peluches'?'Une peluche adorable à adopter et à câliner.':'Le petit accessoire parfait pour habiller votre doudou.'}</p><p class="price-big">${fmt(p.price)}</p></div></div>
      <div class="modal-actions"><button class="ghost-button" data-action="close">Continuer mes achats</button><button class="primary-button" data-action="toggle-item" data-id="${p.id}">${chosen?'✓ Retirer du panier':'＋ Ajouter au panier'}</button></div>`);
  }
  function showCart() {
    if(!state.cart.length) {
      showOverlay(`<button class="modal-close" data-action="close" aria-label="Fermer">×</button><h2 class="modal-title">🛍️ Mon panier</h2><p>Votre panier est encore vide. Choisissez au moins un article.</p><button class="primary-button" data-action="close">Découvrir les articles →</button>`);
      return;
    }
    showOverlay(`<button class="modal-close" data-action="close" aria-label="Fermer">×</button><h2 class="modal-title">🛍️ Mon panier</h2><div class="cart-items">${state.cart.map(id => {const p=itemById.get(id);return `<div class="cart-row"><img src="${p.img}" alt=""/><div><h3>${h(p.name)}</h3><p>Case n° ${p.slot} · ${p.category}</p><strong>${fmt(p.price)}</strong></div><button class="remove-button" data-action="remove" data-id="${p.id}">Retirer</button></div>`}).join('')}</div><div class="total-row"><span>Total (${state.cart.length})</span><strong>${fmt(total())}</strong></div><div class="modal-actions"><button class="ghost-button" data-action="close">← Continuer</button><button class="primary-button" data-action="checkout">Passer au paiement →</button></div>`);
  }
  function inputPickup(key) {
    if(key==='effacer') state.keypad=state.keypad.slice(0,-1);
    else if(key==='retour') state.keypad='';
    else state.keypad=(state.keypad+key).slice(0,8);
    const input=document.querySelector('#pickup-code');if(input) input.value=state.keypad;
    const error=document.querySelector('#pickup-error');if(error)error.textContent='';
  }
  function validatePickup() {
    const code=state.keypad;
    const error=document.querySelector('#pickup-error');
    if(!/^\d{8}$/.test(code)){if(error) error.textContent='Le code doit contenir exactement 8 chiffres.';return;}
    if(code==='12345678') {
      state.lastOrder={code,slots:[randomInteger(80)+1],kind:'pickup'};
      state.keypad=''; setView('success'); return;
    }
    const order=state.orders.find(x=>x.code===code);
    if(!order || order.used) {if(error) error.textContent=order?.used?'Ce code a déjà été utilisé.':'Code non reconnu. Vérifiez les 8 chiffres.';return;}
    order.used=true; saveOrders();
    state.lastOrder={code,slots:order.slots,kind:'pickup'};
    state.keypad=''; setView('success');
  }
  function pay() {
    if(!state.cart.length){toast('Choisissez au moins un article.');setView('catalog');return;}
    if(state.method==='card') {
      const number=(document.querySelector('#test-card')?.value||'').replace(/\D/g,'');
      if(number!=='4242424242424242') {document.querySelector('#payment-error').textContent='Utilisez exclusivement le numéro de test : 4242 4242 4242 4242.';return;}
    }
    const order={code:makeCode(),slots:cartSlots(),used:false,createdAt:new Date().toISOString()};
    state.orders.push(order);saveOrders();
    state.lastOrder={...order,kind:'payment'};
    state.cart=[];
    setView('success');
  }
  document.addEventListener('click', e=> {
    if(e.target===overlay) {closeOverlay();return;}
    const button=e.target.closest('button[data-action]'); if(!button)return;
    const action=button.dataset.action;
    switch(action) {
      case 'home': state.cart=[];state.keypad='';setView('home');break;
      case 'choose':setView('category');break;
      case 'pickup':state.keypad='';setView('pickup');break;
      case 'category':state.category=button.dataset.category;state.page=0;setView('catalog');break;
      case 'switch':state.category=button.dataset.category;state.page=0;setView('catalog');break;
      case 'catalog':setView('catalog');break;
      case 'prev':if(state.page>0) {state.page--;setView('catalog')}break;
      case 'next':if(state.page<1) {state.page++;setView('catalog')}break;
      case 'detail':showDetail(button.dataset.id);break;
      case 'toggle-item':{
        const id=button.dataset.id;
        if(state.cart.includes(id)) {state.cart=state.cart.filter(x=>x!==id);toast('Article retiré du panier');}
        else {state.cart.push(id);toast('✓ Article ajouté au panier');}
        closeOverlay();setView('catalog');break;
      }
      case 'cart':showCart();break;
      case 'remove':state.cart=state.cart.filter(id=>id!==button.dataset.id);showCart();document.querySelectorAll('.cart-count').forEach(el=>el.textContent=state.cart.length);break;
      case 'close':closeOverlay();break;
      case 'checkout':if(state.cart.length){state.method='card';setView('payment')}else toast('Choisissez au moins un article.');break;
      case 'method':state.method=button.dataset.method;setView('payment');break;
      case 'pay':pay();break;
      case 'key':inputPickup(button.dataset.key);break;
      case 'validate-code':validatePickup();break;
      case 'finish':state.lastOrder=null;state.cart=[];setView('home');break;
      case 'fullscreen':if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>toast('Le mode plein écran n’est pas disponible.'));else document.exitFullscreen?.();break;
    }
  });
  document.addEventListener('input', e=>{
    if(e.target.id==='pickup-code'){
      state.keypad=e.target.value.replace(/\D/g,'').slice(0,8);
      e.target.value=state.keypad;
      const err=document.querySelector('#pickup-error');if(err)err.textContent='';
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') closeOverlay();
    if(state.view==='pickup'&&e.key==='Enter')validatePickup();
  });
  setView('home');
})();

</script>
